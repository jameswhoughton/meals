apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meals-mysql
  template:
    metadata:
      labels:
        app: meals-mysql
    spec:
      containers:
      - name: mysql-container
        image: mysql
        ports:
          - containerPort: 3306
        env:
        - name: MYSQL_DATABASE
          value: "meals"
        - name: MYSQL_ALLOW_EMPTY_PASSWORD
          value: "yes"
        volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
      volumes:
      - name: mysql-data
        persistentVolumeClaim:
          claimName: mysql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
spec:
  selector:
    app: meals-mysql
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306
